# HTTP — health check (for HTTP-01 challenges) + redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name together.kebruni.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name together.kebruni.me;

    ssl_certificate     /etc/letsencrypt/live/together.kebruni.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/together.kebruni.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;
    ssl_stapling         on;
    ssl_stapling_verify  on;

    include /etc/nginx/snippets/security-headers.conf;

    limit_conn lf_conn 256;

    # Static assets — long-cache, immutable.
    location /_next/static/ {
        proxy_pass http://linkforge_app;
        include /etc/nginx/snippets/proxy.conf;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public uploads (if proxied via app route).
    location /uploads/ {
        proxy_pass http://linkforge_app;
        include /etc/nginx/snippets/proxy.conf;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Auth endpoints — strict rate-limit.
    location /api/auth/ {
        limit_req zone=lf_auth burst=10 nodelay;
        proxy_pass http://linkforge_app;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Analytics ingestion — high burst, but capped.
    location /api/analytics/ {
        limit_req zone=lf_track burst=300 nodelay;
        proxy_pass http://linkforge_app;
        include /etc/nginx/snippets/proxy.conf;
    }

    # All other API calls.
    location /api/ {
        limit_req zone=lf_api burst=60 nodelay;
        proxy_pass http://linkforge_app;
        include /etc/nginx/snippets/proxy.conf;
    }

    # SSE / WebSocket support for realtime dashboard.
    location /ws {
        proxy_pass http://linkforge_app;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 86400s;
    }

    # Public pages and dashboard.
    location / {
        proxy_pass http://linkforge_app;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Block hidden files.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
