user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 25m;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    reset_timedout_connection on;

    # Logging — minimal but trace-friendly.  Add a trace id later if needed.
    log_format main '$remote_addr - $remote_user [$time_iso8601] '
                    '"$request" $status $body_bytes_sent rt=$request_time '
                    'ua="$http_user_agent" ref="$http_referer"';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml application/wasm
        font/woff2 font/woff text/javascript application/x-javascript;

    # Brotli (only if your nginx build has it; safe to leave commented)
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate-limit zones
    limit_req_zone  $binary_remote_addr zone=lf_api:10m       rate=120r/m;
    limit_req_zone  $binary_remote_addr zone=lf_auth:10m      rate=20r/m;
    limit_req_zone  $binary_remote_addr zone=lf_track:10m     rate=600r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=lf_conn:10m;

    # Upstream
    upstream linkforge_app {
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}
